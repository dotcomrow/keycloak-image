name: build-test-push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version to build/test"
        required: false
        default: "26.5.1"
      kc_features:
        description: "Keycloak features to bake in (build-time)"
        required: false
        default: "token-exchange-standard,token-exchange-external-internal"
      kc_http_relative_path:
        description: "Keycloak HTTP relative path to bake in (build-time)"
        required: false
        default: "/"
      kc_transaction_xa_enabled:
        description: "Enable XA transactions at build-time"
        required: false
        default: "false"

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  DEFAULT_KEYCLOAK_VERSION: "26.5.1"
  DEFAULT_KC_FEATURES: "token-exchange-standard,token-exchange-external-internal"
  DEFAULT_KC_HTTP_RELATIVE_PATH: "/"
  DEFAULT_KC_TRANSACTION_XA_ENABLED: "false"
  # Provider IDs must match AuthenticatorFactory.getId()
  PROVIDER_IDS: |
    github-team-admin
    google-groups-authenticator

jobs:
  build-test-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Resolve Keycloak build args
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.keycloak_version }}" ]; then
            KEYCLOAK_VERSION="${{ inputs.keycloak_version }}"
          else
            KEYCLOAK_VERSION="${{ env.DEFAULT_KEYCLOAK_VERSION }}"
          fi

          if [ -z "$KEYCLOAK_VERSION" ]; then
            echo "❌ Unable to resolve KEYCLOAK_VERSION from inputs or default." >&2
            exit 1
          fi

          echo "KEYCLOAK_VERSION=$KEYCLOAK_VERSION" >> "$GITHUB_ENV"
          echo "Using KEYCLOAK_VERSION=$KEYCLOAK_VERSION"

          if [ -n "${{ inputs.kc_features }}" ]; then
            KC_FEATURES="${{ inputs.kc_features }}"
          else
            KC_FEATURES="${{ env.DEFAULT_KC_FEATURES }}"
          fi

          if [ -n "${{ inputs.kc_http_relative_path }}" ]; then
            KC_HTTP_RELATIVE_PATH="${{ inputs.kc_http_relative_path }}"
          else
            KC_HTTP_RELATIVE_PATH="${{ env.DEFAULT_KC_HTTP_RELATIVE_PATH }}"
          fi

          if [ -n "${{ inputs.kc_transaction_xa_enabled }}" ]; then
            KC_TRANSACTION_XA_ENABLED="${{ inputs.kc_transaction_xa_enabled }}"
          else
            KC_TRANSACTION_XA_ENABLED="${{ env.DEFAULT_KC_TRANSACTION_XA_ENABLED }}"
          fi

          for v in KC_FEATURES KC_HTTP_RELATIVE_PATH KC_TRANSACTION_XA_ENABLED; do
            if [ -z "${!v:-}" ]; then
              echo "❌ Unable to resolve ${v} from inputs or defaults." >&2
              exit 1
            fi
          done

          echo "KC_FEATURES=$KC_FEATURES" >> "$GITHUB_ENV"
          echo "KC_HTTP_RELATIVE_PATH=$KC_HTTP_RELATIVE_PATH" >> "$GITHUB_ENV"
          echo "KC_TRANSACTION_XA_ENABLED=$KC_TRANSACTION_XA_ENABLED" >> "$GITHUB_ENV"
          echo "Using KC_FEATURES=$KC_FEATURES"
          echo "Using KC_HTTP_RELATIVE_PATH=$KC_HTTP_RELATIVE_PATH"
          echo "Using KC_TRANSACTION_XA_ENABLED=$KC_TRANSACTION_XA_ENABLED"

      - name: Set up Java 24
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Compute tags/labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ env.KEYCLOAK_VERSION }}-sha-${{ github.sha }}
            type=raw,value=${{ env.KEYCLOAK_VERSION }}
            type=sha

      - name: Build (load locally for tests) — single build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: false
          load: true
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
            KC_FEATURES=${{ env.KC_FEATURES }}
            KC_HTTP_RELATIVE_PATH=${{ env.KC_HTTP_RELATIVE_PATH }}
            KC_TRANSACTION_XA_ENABLED=${{ env.KC_TRANSACTION_XA_ENABLED }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select local test tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG="$(printf '%s\n' "$TAGS" | head -n1)"
          echo "IMG=$IMG" >> $GITHUB_ENV
          echo "Using test image tag: $IMG"

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create kc-net
          docker run -d --rm --name kc-db --network kc-net \
            -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD=keycloak \
            -e POSTGRES_DB=keycloak \
            -p 5432:5432 \
            postgres:15
          for i in {1..60}; do
            docker exec kc-db pg_isready -U keycloak -d keycloak && break || sleep 2
          done
          docker exec kc-db pg_isready -U keycloak -d keycloak

      - name: Start Keycloak (under test)
        run: |
          set -euo pipefail
          docker run -d --rm --name kc --network kc-net -p 8080:8080 -p 9000:9000 \
            -e KC_DB=postgres \
            -e KC_DB_URL=jdbc:postgresql://kc-db:5432/keycloak \
            -e KC_DB_USERNAME=keycloak \
            -e KC_DB_PASSWORD=keycloak \
            -e KC_DB_SCHEMA=public \
            -e KC_HEALTH_ENABLED=true \
            -e DEBUG_ALWAYS_GRANT=true \
            "$IMG"
          for i in {1..120}; do
            curl -fsS http://localhost:9000/health/ready && break || sleep 2
          done
          curl -fsS http://localhost:9000/health/ready

      - name: Verify provider jars present in container
        run: |
          set -euo pipefail
          echo "Listing /opt/keycloak/providers in container:"
          docker exec kc bash -lc 'ls -l /opt/keycloak/providers || true'
          COUNT=$(docker exec kc bash -lc 'shopt -s nullglob; set -- /opt/keycloak/providers/*.jar; echo $#')
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No JARs found under /opt/keycloak/providers. Your Dockerfile may not be copying the artifact name you expect."
            exit 1
          fi

      - name: Prove BOTH providers work via kcadm (create flows, add execs, set REQUIRED)
        env:
          PROVIDER_IDS: ${{ env.PROVIDER_IDS }}
        run: |
          set -euo pipefail
          SERVER=http://localhost:8080
          REALM=master

          docker exec kc /opt/keycloak/bin/kcadm.sh config credentials \
            --server "$SERVER" --realm "$REALM" \
            --user admin --password admin

          echo "Fetch authenticator providers list..."
          LIST=$(docker exec kc /opt/keycloak/bin/kcadm.sh \
                   get authentication/authenticator-providers -r "$REALM")
          echo "$LIST" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | sort -u

          # Loop over declared providers
          echo "$PROVIDER_IDS" | while read -r PROVIDER_ID; do
            [ -z "$PROVIDER_ID" ] && continue
            echo "=== Testing provider: $PROVIDER_ID ==="

            echo "Check provider is present..."
            echo "$LIST" | grep -q "\"id\"[[:space:]]*:[[:space:]]*\"$PROVIDER_ID\"" || {
              echo "❌ Provider id '$PROVIDER_ID' not found."; exit 1; }

            FLOW="CI-Test-${PROVIDER_ID}"

            echo "Create or reset test flow '$FLOW'..."
            if docker exec kc /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" \
                 | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$FLOW\""; then
              EXECS=$(docker exec kc /opt/keycloak/bin/kcadm.sh get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
              IDS=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              if [ -n "$IDS" ]; then
                while read -r EID; do
                  [ -n "$EID" ] && docker exec kc /opt/keycloak/bin/kcadm.sh delete "authentication/executions/$EID" -r "$REALM" || true
                done <<<"$IDS"
              fi
            else
              docker exec kc /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
                -s "alias=$FLOW" -s "providerId=basic-flow" -s "topLevel=true" -s "builtIn=false" \
                -s "description=CI test flow for $PROVIDER_ID"
            fi

            echo "Add '$PROVIDER_ID' as execution..."
            docker exec kc /opt/keycloak/bin/kcadm.sh \
              create "authentication/flows/$FLOW/executions/execution" -r "$REALM" \
              -s provider="$PROVIDER_ID"

            echo "Discover execution id..."
            EID=""
            for i in {1..40}; do
              EXECS=$(docker exec kc /opt/keycloak/bin/kcadm.sh \
                        get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
              EID=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' \
                | awk -v id="$PROVIDER_ID" '
                    /"providerId"[[:space:]]*:[[:space:]]*"/ {p=$0}
                    /"id"[[:space:]]*:/ && p ~ ("\"" id "\"") {match($0, /"id"[[:space:]]*:[[:space:]]*"([^"]+)"/, m); print m[1]; exit}
                  ')
              [ -n "$EID" ] && break || sleep 1
            done
            [ -n "${EID:-}" ] || { echo "❌ Could not discover execution id for '$PROVIDER_ID'"; exit 1; }
            echo "Execution id: $EID"

            echo "Set REQUIRED requirement (with retries)..."
            ok=""
            for i in {1..10}; do
              if docker exec kc /opt/keycloak/bin/kcadm.sh update "authentication/executions/$EID" -r "$REALM" -s 'requirement=REQUIRED'; then
                ok="yes"; break
              else
                echo "   (attempt $i) execution endpoint not ready; retrying..."
                sleep 1
              fi
            done

            if [ -z "$ok" ]; then
              echo "Falling back to flow-level update endpoint..."
              printf '{ "id": "%s", "requirement": "REQUIRED" }\n' "$EID" \
                | docker exec -i kc /opt/keycloak/bin/kcadm.sh update "authentication/flows/$FLOW/executions" -r "$REALM" -f -
            fi

            echo "Verify requirement..."
            docker exec kc /opt/keycloak/bin/kcadm.sh \
              get "authentication/flows/$FLOW/executions" -r "$REALM" \
              | awk -v id="$EID" -v RS='},' '
                  $0 ~ "\"id\"[[:space:]]*:[[:space:]]*\"" id "\"" && $0 ~ "\"requirement\"[[:space:]]*:[[:space:]]*\"REQUIRED\"" {found=1}
                  END {exit (found?0:1)}'
            echo "✅ Provider '$PROVIDER_ID' present and REQUIRED under flow '$FLOW'."
          done

      - name: Log in to GHCR (for push)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push built image tags (no rebuild)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "Pushing tags:"
          printf '%s\n' "$TAGS"
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

      - name: Teardown
        if: always()
        run: |
          docker logs kc || true
          docker logs kc-db || true
          docker rm -f kc kc-db || true
          docker network rm kc-net || true

      - name: Upload logs (failure)
        if: failure()
        run: |
          docker logs kc > kc.log 2>&1 || true
          docker logs kc-db > kc-db.log 2>&1 || true
        continue-on-error: true

      - name: Publish logs artifact (failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keycloak-ci-logs
          path: |
            kc.log
            kc-db.log
