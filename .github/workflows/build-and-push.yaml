name: build-test-push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version to build/test"
        required: false
        default: "24.0.5"

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  KEYCLOAK_VERSION: ${{ inputs.keycloak_version || '24.0.5' }}
  # Change this if your AuthenticatorFactory.getId() differs
  PROVIDER_ID: github-team-admin

jobs:
  build-test-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ env.KEYCLOAK_VERSION }}-sha-${{ github.sha }}
            type=raw,value=${{ env.KEYCLOAK_VERSION }}
            type=sha

      - name: Build (load locally for tests) — single build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false           # don't push here
          load: true            # load to local Docker for tests
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select local test tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG="$(printf '%s\n' "$TAGS" | head -n1)"
          echo "IMG=$IMG" >> $GITHUB_ENV
          echo "Using test image tag: $IMG"

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create kc-net
          docker run -d --rm --name kc-db --network kc-net \
            -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD=keycloak \
            -e POSTGRES_DB=keycloak \
            -p 5432:5432 \
            postgres:15
          for i in {1..60}; do
            docker exec kc-db pg_isready -U keycloak -d keycloak && break || sleep 2
          done
          docker exec kc-db pg_isready -U keycloak -d keycloak

      - name: Start Keycloak (under test)
        run: |
          set -euo pipefail
          docker run -d --rm --name kc --network kc-net -p 8080:8080 \
            -e KC_DB=postgres \
            -e KC_DB_URL=jdbc:postgresql://kc-db:5432/keycloak \
            -e KC_DB_USERNAME=keycloak \
            -e KC_DB_PASSWORD=keycloak \
            -e KC_DB_SCHEMA=public \
            -e DEBUG_ALWAYS_GRANT=true \
            "$IMG"
          for i in {1..120}; do
            curl -fsS http://localhost:8080/health/ready && break || sleep 2
          done
          curl -fsS http://localhost:8080/health/ready

      - name: Verify provider jar present in container
        run: |
          set -euo pipefail
          echo "Listing /opt/keycloak/providers in container:"
          docker exec kc bash -lc 'ls -l /opt/keycloak/providers || true'
          COUNT=$(docker exec kc bash -lc 'shopt -s nullglob; set -- /opt/keycloak/providers/*.jar; echo $#')
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No JARs found under /opt/keycloak/providers. Your Dockerfile may not be copying the artifact name you expect."
            exit 1
          fi

      - name: Prove provider works via kcadm
        run: |
          set -euo pipefail
          SERVER=http://localhost:8080
          REALM=master
          FLOW="GitHub-PostLogin"
          PROVIDER_ID="${{ env.PROVIDER_ID }}"

          docker exec kc /opt/keycloak/bin/kcadm.sh config credentials \
            --server "$SERVER" --realm "$REALM" \
            --user admin --password admin

          echo "Check provider is present..."
          LIST=$(docker exec kc /opt/keycloak/bin/kcadm.sh \
                   get authentication/authenticator-providers -r "$REALM")
          echo "$LIST" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          echo "$LIST" | grep -q "\"id\"[[:space:]]*:[[:space:]]*\"$PROVIDER_ID\"" || {
            echo "❌ Provider id '$PROVIDER_ID' not found."; exit 1; }

          echo "Create or reset flow..."
          if ! docker exec kc /opt/keycloak/bin/kcadm.sh get authentication/flows -r "$REALM" \
               | grep -q "\"alias\"[[:space:]]*:[[:space:]]*\"$FLOW\""; then
            docker exec kc /opt/keycloak/bin/kcadm.sh create authentication/flows -r "$REALM" \
              -s "alias=$FLOW" -s "providerId=basic-flow" -s "topLevel=true" -s "builtIn=false" \
              -s 'description=Grant realm-admin to members of a GitHub team'
          fi

          echo "Purge existing executions..."
          EXECS=$(docker exec kc /opt/keycloak/bin/kcadm.sh get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
          IDS=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' \
            | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -n "$IDS" ]; then
            while read -r EID; do
              [ -n "$EID" ] && docker exec kc /opt/keycloak/bin/kcadm.sh delete "authentication/executions/$EID" -r "$REALM" || true
            done <<<"$IDS"
          fi

          echo "Add our provider as execution..."
          docker exec kc /opt/keycloak/bin/kcadm.sh \
            create "authentication/flows/$FLOW/executions/execution" -r "$REALM" \
            -s provider="$PROVIDER_ID"

          echo "Discover execution id..."
          EID=""
          for i in {1..40}; do
            EXECS=$(docker exec kc /opt/keycloak/bin/kcadm.sh \
                      get "authentication/flows/$FLOW/executions" -r "$REALM" || echo "[]")
            EID=$(echo "$EXECS" | tr -d '\n' | sed 's/},[[:space:]]*{/}\n{/g' \
              | awk -v id="$PROVIDER_ID" '
                  /"providerId"[[:space:]]*:[[:space:]]*"/ {p=$0}
                  /"id"[[:space:]]*:/ && p ~ ("\"" id "\"") {match($0, /"id"[[:space:]]*:[[:space:]]*"([^"]+)"/, m); print m[1]; exit}
                ')
            [ -n "$EID" ] && break || sleep 1
          done
          [ -n "${EID:-}" ] || { echo "❌ Could not discover execution id for '$PROVIDER_ID'"; exit 1; }
          echo "Execution id: $EID"

          echo "Set REQUIRED requirement (execution endpoint, with retries)..."
          ok=""
          for i in {1..10}; do
            if docker exec kc /opt/keycloak/bin/kcadm.sh update "authentication/executions/$EID" -r "$REALM" -s 'requirement=REQUIRED'; then
              ok="yes"; break
            else
              echo "   (attempt $i) execution endpoint not ready; retrying..."
              sleep 1
            fi
          done

          if [ -z "$ok" ]; then
            echo "Falling back to flow-level update endpoint..."
            cat > /tmp/req.json <<JSON
          { "id": "$EID", "requirement": "REQUIRED" }
          JSON
            docker exec -i kc /opt/keycloak/bin/kcadm.sh update "authentication/flows/$FLOW/executions" -r "$REALM" -f - < /tmp/req.json
          fi

          echo "Verify requirement..."
          docker exec kc /opt/keycloak/bin/kcadm.sh \
            get "authentication/flows/$FLOW/executions" -r "$REALM" \
            | awk -v id="$EID" -v RS='},' '
                $0 ~ "\"id\"[[:space:]]*:[[:space:]]*\"" id "\"" && $0 ~ "\"requirement\"[[:space:]]*:[[:space:]]*\"REQUIRED\"" {found=1}
                END {exit (found?0:1)}'
          echo "✅ Provider present and REQUIRED under flow '$FLOW'."

      - name: Log in to GHCR (for push)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push built image tags (no rebuild)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "Pushing tags:"
          printf '%s\n' "$TAGS"
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

      - name: Teardown
        if: always()
        run: |
          docker logs kc || true
          docker logs kc-db || true
          docker rm -f kc kc-db || true
          docker network rm kc-net || true

      - name: Upload logs (failure)
        if: failure()
        run: |
          docker logs kc > kc.log 2>&1 || true
          docker logs kc-db > kc-db.log 2>&1 || true
        continue-on-error: true

      - name: Publish logs artifact (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-ci-logs
          path: |
            kc.log
            kc-db.log
